<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMaster</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h2>⚡ QuizMaster</h2>
    <span id="userBadge">Guest</span>
</header>

<main>
    <section id="authPanel" class="card">
        <h1>Welcome to QuizMaster</h1>
        <p>Create an account or log in to start learning.</p>

        <div class="buttons">
            <button onclick="setMode('login')">Login</button>
            <button onclick="setMode('register')">Sign up</button>
        </div>

        <form id="authForm">
            <input id="username" placeholder="Username">
            <input id="email" type="email" placeholder="Email" required>
            <input id="password" type="password"
                   placeholder="Password (8+ characters)"
                   minlength="8" required>
            <button id="authSubmit" type="submit">Login</button>
        </form>
        <p id="authMessage"></p>
    </section>

    <section id="appPanel" class="hidden">
        <div class="card">
            <h1>Welcome, <span id="welcomeName"></span>!</h1>
            <button onclick="logout()">Log out</button>
            <div class="stats">
                <div><p>Highest level</p><h2 id="highestLevel">0</h2></div>
                <div><p>Rank</p><h2 id="rankValue">Silver</h2></div>
            </div>
        </div>

        <div class="card">
            <h2>Start a quiz</h2>
            <label for="levelSelect">Select level</label>
            <select id="levelSelect"></select>
            <button id="startBtn">Start quiz</button>
            <p id="quizMessage"></p>
            <div id="quizArea"></div>
            <div id="resultArea"></div>
        </div>

        <div class="card">
            <h2>Leaderboard</h2>
            <button id="refreshLeaderboard">Refresh</button>
            <div id="leaderboard"></div>
        </div>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
